<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRS Coin - Tap to Earn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }
        .header h1 {
            font-size: 16px;
            color: #8a99ad;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .balance-container {
            font-size: 42px;
            font-weight: 800;
            color: #f3ba2f;
            text-shadow: 0 0 20px rgba(243, 186, 47, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .passive-income {
            font-size: 14px;
            color: #00ffcc;
            margin-top: 5px;
        }
        .coin-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            position: relative;
            width: 100%;
            max-width: 300px;
        }
        .main-coin {
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, #f3ba2f 0%, #a87900 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(243, 186, 47, 0.4), inset 0 0 20px rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: transform 0.05s ease;
            border: 8px solid #1e2638;
        }
        .main-coin:active {
            transform: scale(0.95);
        }
        .stats-panel {
            width: 100%;
            max-width: 400px;
            background: #161c2c;
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 1px solid #242f48;
        }
        .energy-bar-container {
            width: 100%;
            height: 12px;
            background-color: #242f48;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
        .energy-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f3ba2f, #ffea79);
            transition: width 0.1s linear;
        }
        .energy-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #8a99ad;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #161c2c;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #242f48;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f3ba2f;
        }
        .wallet-status {
            background: #20293d;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            color: #ff4a4a;
            border: 1px dashed #ff4a4a;
            margin-bottom: 15px;
        }
        .btn-grid {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            background: #242f48;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #2e3d5e;
        }
        .btn-claim {
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            width: 100%;
            margin-top: 10px;
        }
        .btn-buy {
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
        }
        .item-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .floating-text {
            position: absolute;
            color: #f3ba2f;
            font-size: 28px;
            font-weight: bold;
            animation: floatUp 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Total Earnings</h1>
        <div class="balance-container">
            <span id="balance">0</span> <span style="font-size: 24px; color:#fff;">DRS</span>
        </div>
        <div class="passive-income">Passive Income: +<span id="pps">0</span> DRS/s</div>
    </div>

    <div class="coin-container">
        <div class="main-coin" id="coinBtn">🪙</div>
    </div>

    <div class="stats-panel">
        <div class="energy-text">
            <span>⚡ Energy</span>
            <span><span id="energy">500</span> / 500</span>
        </div>
        <div class="energy-bar-container">
            <div class="energy-bar" id="energyBar"></div>
        </div>
    </div>

    <!-- Wallet Card -->
    <div class="card">
        <div class="card-title">👛 Real Crypto Wallet</div>
        <div class="wallet-status">⚠️ Wallet Not Connected</div>
        <div class="btn-grid">
            <button class="btn" onclick="alert('Wallet integration coming soon!')">Real Deposit</button>
            <button class="btn" onclick="alert('Withdrawals open after TGE!')">Real Withdraw</button>
        </div>
    </div>

    <!-- Quests Card -->
    <div class="card">
        <div class="card-title">📋 Daily Quests</div>
        <div class="item-info">
            <span>📅 Daily Check-In</span>
            <span style="color: #00ffcc;">+1,000 DRS</span>
        </div>
        <button class="btn btn-claim" id="claimBtn">Claim Bonus</button>
    </div>

    <!-- Upgrade Shop Card -->
    <div class="card">
        <div class="card-title">🛒 DRS Upgrade Shop</div>
        <div class="item-info">
            <div>
                <strong>⚙️ Basic DRS Mining Rig</strong><br>
                <span style="color:#8a99ad; font-size:12px;">Generates +2 DRS/sec</span>
            </div>
            <span style="font-weight:bold; color:#f3ba2f;">500 DRS</span>
        </div>
        <button class="btn btn-buy" id="buyUpgradeBtn">Buy Upgrade</button>
    </div>

    <script>
        let balance = 0;
        let energy = 500;
        const maxEnergy = 500;
        let passiveIncome = 0;

        const balanceEl = document.getElementById('balance');
        const energyEl = document.getElementById('energy');
        const energyBar = document.getElementById('energyBar');
        const ppsEl = document.getElementById('pps');
        const coinBtn = document.getElementById('coinBtn');
        const claimBtn = document.getElementById('claimBtn');
        const buyUpgradeBtn = document.getElementById('buyUpgradeBtn');
        const coinContainer = document.querySelector('.coin-container');

        // Tap Functionality
        coinBtn.addEventListener('click', (e) => {
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                updateUI();
                createFloatingText(e);
            }
        });

        function updateUI() {
            balanceEl.innerText = balance.toLocaleString();
            energyEl.innerText = energy;
            energyBar.style.width = (energy / maxEnergy * 100) + '%';
            ppsEl.innerText = passiveIncome;
        }

        // Floating +1 Text Animation
        function createFloatingText(e) {
            const text = document.createElement('div');
            text.innerText = '+1';
            text.classList.add('floating-text');
            
            // Positioning text near click
            const rect = coinContainer.getBoundingClientRect();
            const x = e.clientX - rect.left - 10;
            const y = e.clientY - rect.top - 20;
            
            text.style.left = x + 'px';
            text.style.top = y + 'px';
            
            coinContainer.appendChild(text);
            setTimeout(() => text.remove(), 600);
        }

        // Daily Claim
        claimBtn.addEventListener('click', () => {
            balance += 1000;
            updateUI();
            alert('1,000 DRS Coins Claimed successfully!');
            claimBtn.disabled = true;
            claimBtn.innerText = "Claimed Today";
            claimBtn.style.background = "#242f48";
        });

        // Buy Upgrade
        buyUpgradeBtn.addEventListener('click', () => {
            if (balance >= 500) {
                balance -= 500;
                passiveIncome += 2;
                updateUI();
                alert('Mining Rig Purchased! Passive income active.');
            } else {
                alert('Not enough DRS Coins! You need 500 DRS.');
            }
        });
