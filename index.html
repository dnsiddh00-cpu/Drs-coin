<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRS Coin - Tap to Earn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }
        .balance-container {
            font-size: 42px;
            font-weight: 800;
            color: #f3ba2f;
        }
        .passive-income {
            font-size: 14px;
            color: #00ffcc;
            margin-top: 5px;
        }
        .coin-container {
            margin: 30px 0;
            position: relative;
        }
        .main-coin {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #f5b000 0%, #a87900 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(243, 186, 47, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            border: 6px solid #1e2638;
        }
        .stats-panel {
            width: 100%;
            max-width: 400px;
            background: #161c2c;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .energy-bar-container {
            width: 100%;
            height: 12px;
            background-color: #242f48;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
        .energy-bar {
            width: 100%;
            height: 100%;
            background: #f3ba2f;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #161c2c;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .btn {
            width: 100%;
            background: #242f48;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        .floating-text {
            position: absolute;
            color: #f3ba2f;
            font-size: 32px;
            font-weight: bold;
            animation: floatUp 0.4s ease-out forwards;
            pointer-events: none;
            top: 40px;
            left: 80px;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-60px); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="color:#8a99ad; font-size:16px;">Total Earnings</h2>
        <div class="balance-container">
            <span id="balance">0</span> DRS
        </div>
        <div class="passive-income">Passive Income: +<span id="pps">0</span> DRS/s</div>
    </div>

    <div class="coin-container">
        <div class="main-coin" id="coinBtn">🪙</div>
    </div>

    <div class="stats-panel">
        <div style="display: flex; justify-content: space-between; font-size: 14px;">
            <span>⚡ Energy</span>
            <span><span id="energy">500</span> / 500</span>
        </div>
        <div class="energy-bar-container">
            <div class="energy-bar" id="energyBar"></div>
        </div>
    </div>

    <div class="card">
        <h3>📋 Daily Quests</h3>
        <p style="font-size:14px; margin-top:5px; color:#00ffcc;">+1,000 DRS Coins</p>
        <button class="btn" id="claimBtn">Claim Bonus</button>
    </div>

    <div class="card">
        <h3>🛒 DRS Upgrade Shop</h3>
        <p style="font-size:14px; margin-top:5px; color:#8a99ad;">Price: 500 DRS (+2 DRS/sec)</p>
        <button class="btn" id="buyUpgradeBtn">Buy Upgrade</button>
    </div>

    <script>
        let balance = 0;
        let energy = 500;
        const maxEnergy = 500;
        let passiveIncome = 0;

        const balanceEl = document.getElementById('balance');
        const energyEl = document.getElementById('energy');
        const energyBar = document.getElementById('energyBar');
        const ppsEl = document.getElementById('pps');
        const coinBtn = document.getElementById('coinBtn');
        const claimBtn = document.getElementById('claimBtn');
        const buyUpgradeBtn = document.getElementById('buyUpgradeBtn');
        const coinContainer = document.querySelector('.coin-container');

        // Simple click & touch logic combined
        function triggerTap() {
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                updateUI();
                createFloatingText();
            }
        }

        coinBtn.addEventListener('click', triggerTap);
        coinBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerTap();
        });

        function updateUI() {
            balanceEl.innerText = balance;
            energyEl.innerText = energy;
            energyBar.style.width = (energy / maxEnergy * 100) + '%';
            ppsEl.innerText = passiveIncome;
        }

        function createFloatingText() {
            const text = document.createElement('div');
            text.innerText = '+1';
            text.classList.add('floating-text');
            coinContainer.appendChild(text);
            setTimeout(() => text.remove(), 400);
        }

        claimBtn.addEventListener('click', () => {
            balance += 1000;
            updateUI();
            alert('1,000 DRS Coins Claimed!');
            claimBtn.disabled = true;
            claimBtn.style.background = "grey";
        });

        buyUpgradeBtn.addEventListener('click', () => {
            if (balance >= 500) {
                balance -= 500;
                passiveIncome += 2;
                updateUI();
                alert('Mining Rig Purchased!');
            } else {
                alert('Not enough DRS Coins!');
            }
        });

        setInterval(() => {
            if (passiveIncome > 0) balance += passiveIncome;
            if (energy < maxEnergy) energy += 1;
            updateUI();
        }, 1000);
    </script>
</body>
</html>
