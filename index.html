<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRS Token - Ultimate Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background: #020617;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 15px 75px 15px;
            overflow: hidden;
        }
        
        /* Top User Profile Header */
        .top-profile-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 41, 59, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .user-avatar {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 50%;
            display: inline-block;
        }
        .faq-btn {
            background: rgba(30, 41, 59, 0.6);
            color: #94a3b8;
            border: none;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 1win Premium Score Dashboard */
        .dashboard {
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }
        .game-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .main-score {
            font-size: 34px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }
        .coin-icon-small {
            width: 32px;
            height: 32px;
            background: radial-gradient(circle, #ffe680 0%, #d97706 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            border: 2px solid #1e293b;
        }

        /* Sub-Stats Badge row */
        .sub-stats-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
        }
        .stat-badge {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-badge.gold { color: #f59e0b; }
        .stat-badge.blue { color: #38bdf8; border-color: rgba(56, 189, 248, 0.2); }

        /* Main Game Center Workspace Content Panels */
        .tab-content {
            display: none;
            width: 100%;
            max-width: 400px;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .tab-content.active {
            display: flex;
        }

        /* 1win Premium Character / Tapper Interface Design */
        .character-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            margin: 15px 0;
        }
        .avatar-clickable {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, #2563eb 0%, #1e1b4b 70%, #020617 100%);
            border-radius: 50%;
            border: 6px solid #1e293b;
            box-shadow: 0 0 60px rgba(37, 99, 235, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease;
            position: relative;
        }
        .avatar-clickable:active {
            transform: scale(0.94);
        }
        .character-emoji {
            font-size: 100px;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
        }
        .character-title-tag {
            position: absolute;
            bottom: 30px;
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            padding: 4px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Energy Module Panels */
        .energy-hud {
            width: 100%;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 16px;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 10px;
        }
        .energy-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .energy-track-bg {
            width: 100%;
            height: 8px;
            background: #090d16;
            border-radius: 4px;
            overflow: hidden;
        }
        .energy-track-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #3b82f6);
            border-radius: 4px;
        }

        /* General List view card matrices */
        .card-list-wrapper {
            width: 100%;
            overflow-y: auto;
            max-height: calc(100vh - 240px);
            padding-bottom: 15px;
            touch-action: pan-y;
        }
        .premium-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-details h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .card-details p {
            font-size: 12px;
            color: #64748b;
        }
        .action-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .action-btn:disabled {
            background: #1e293b;
            color: #475569;
            cursor: not-allowed;
        }

        /* Floating +Points Tapping Particle Effect styling */
        .tap-particle {
            position: absolute;
            color: #38bdf8;
            font-size: 28px;
            font-weight: 900;
            animation: burst 0.4s ease-out forwards;
            pointer-events: none;
            z-index: 100;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        @keyframes burst {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }

        /* 1win Premium Floating Bottom Fixed Navigation Grid */
        .fixed-bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 68px;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding: 0 12px;
        }
        .nav-link-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            padding: 6px 0;
            gap: 5px;
            transition: color 0.15s ease;
        }
        .nav-link-block.active {
            color: #38bdf8;
        }
        .nav-link-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <!-- Top Profile Section -->
    <div class="top-profile-bar">
        <div class="user-badge">
            <span class="user-avatar"></span>
            <span id="username-display">Dhanraj (Lvl 1)</span>
        </div>
        <button class="faq-btn" onclick="alert('1win Style Engine v1.0. Taps accumulator builds metrics tokens.')">FAQ</button>
    </div>

    <!-- Main Score Matrices Header Display -->
    <div class="dashboard">
