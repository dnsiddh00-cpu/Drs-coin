<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRS Coin - Official Bot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Disables browser zoom & scroll completely for seamless tapping */
        }
        body {
            background: radial-gradient(circle at top, #141f36 0%, #070a13 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 20px 80px 20px;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-top: 10px;
            width: 100%;
        }
        .header h1 {
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .balance-container {
            font-size: 42px;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .points-subtext {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .passive-income {
            font-size: 13px;
            color: #10b981;
            margin-top: 4px;
            font-weight: 500;
        }
        .tab-content {
            display: none;
            width: 100%;
            max-width: 390px;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .tab-content.active {
            display: flex;
        }
        .coin-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 40px 0;
        }
        .main-coin {
            width: 210px;
            height: 210px;
            background: radial-gradient(circle, #ffe680 0%, #f59e0b 60%, #b45309 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.6), 
                        inset 0 4px 10px rgba(255,255,255,0.6), 
                        inset 0 -4px 10px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 10px solid #1e293b;
            transition: transform 0.05s ease;
            position: relative;
            pointer-events: auto;
        }
        .main-coin::after {
            content: '';
            position: absolute;
            width: 174px;
            height: 174px;
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
        }
        .coin-text {
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            pointer-events: none;
        }
        .coin-subtext {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: -2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }
        .stats-panel {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 18px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            touch-action: pan-y;
        }
        .energy-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
        }
        .energy-bar-container {
            width: 100%;
            height: 10px;
            background-color: #0f172a;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }
        .energy-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            border-radius: 5px;
        }
        .card {
            width: 100%;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            touch-action: pan-y;
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fbbf24;
        }
        .item-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .btn {
            width: 100%;
            background: #334155;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-claim {
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
        }
        .btn-buy {
            background: linear-gradient(90deg, #059669, #047857);
        }
        .btn-buy:disabled {
            background: #1e293b !important;
            color: #64748b;
            cursor: not-allowed;
        }
        .floating-text {
            position: absolute;
            color: #fbbf24;
            font-size: 34px;
            font-weight: 900;
            animation: floatUp 0.4s ease-out forwards;
            pointer-events: none;
            z-index: 100;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding: 0 10px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            padding: 8px 0;
            gap: 4px;
        }
        .nav-item.active {
            color: #fbbf24;
        }
        .nav-icon {
            font-size: 20px;
        }
        #tab-upgrade {
            overflow-y: auto;
            max-height: calc(100vh - 220px);
            padding-bottom: 20px;
            touch-action: pan-y;
        }
        #tab-tasks {
            overflow-y: auto;
            max-height: calc(100vh - 220px);
            touch-action: pan-y;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>DRS Balance</h1>
        <div class="balance-container">
            <span id="balance">0</span> <span style="font-size: 22px; color:#94a3b8; font-weight:500;">DRS</span>
        </div>
        <div class="points-subtext">💰 Taps: <span id="points">0</span> / 1000 (1000 Taps = 1 DRS)</div>
        <div class="passive-income">⛏️ Auto Income: +<span id="pps">0</span> DRS/s</div>
    </div>

    <!-- TAB 1: TAP AREA -->
    <div id="tab-tap" class="tab-content active">
        <div class="coin-container">
            <!-- Reinforced Tapping Native Target -->
            <div class="main-coin" id="coinBtn">
                <div class="coin-text">DRS</div>
                <div class="coin-subtext">Coin</div>
            </div>
        </div>

        <div class="stats-panel">
            <div class="energy-text">
                <span>⚡ Energy</span>
                <span><span id="energy">1000</span> / 1000</span>
            </div>
            <div class="energy-bar-container">
                <div class="energy-bar" id="energyBar"></div>
            </div>
        </div>
    </div>

    <!-- TAB 2: TASKS AREA -->
    <div id="tab-tasks" class="tab-content" style="margin-top: 20px;">
        <div class="card">
            <div class="card-title">👛 TON Web3 Wallet</div>
            <div style="font-size: 13px; color: #ef4444; border: 1px dashed #ef4444; padding: 10px; border-radius: 8px; text-align: center; font-weight: 500;">
                ⚠️ Wallet Connection opens at Listing Time
            </div>
        </div>

        <div class="card">
            <div class="card-title">📋 Social Quests</div>
            <div class="item-info" style="border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px;">
                <div>📅 Daily Check-In</div>
                <button class="btn btn-claim" id="claimBtn" style="width: auto; padding: 6px 15px;">Claim 1 DRS</button>
            </div>
